# miaoli_bot 配置模板
#
# 用法：
#   1. cp config.example.yaml config.yaml
#   2. 把 api_key 换成真实密钥
#
# 注意：config.yaml 已加入 .gitignore，不会被提交（内含密钥）。
#       本文件是入库的模板，不要在这里填真实密钥。

# session_dir: "/root/miaoli_bot-dev/sessions/"
session_dir: "/tmp/"
prompt_file: "/sdcard/Ncatbot_QQ/plugins/miaoli_bot/data/prompt_v1.3.md"
providers:
  - name: "deepseek"
    base_url: "https://api.deepseek.com/v1"
    api_key: "YOUR_API_KEY_HERE"
    llm_config:
      - name: "deepseek-flash"
      - name: "deepseek-pro"
