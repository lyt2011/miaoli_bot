# meme_ops 配置模板
#
# 用法：
#   cp plugins/meme_ops/config.example.yaml plugins/meme_ops/config.yaml
#
# config.yaml 已加入 .gitignore，不会被提交。本文件是入库的模板。
#
# ⚠️ help_doc.path 是绝对路径，换部署环境（本机 /sdcard ↔ 服务器 /root）时必须改。

enable: true                  # 是否启用表情包功能

database:                     # sqlite 数据库
  # ⚠️ 可以「关闭 + 不填路径」，但不能「启用 + 不填路径」——后者加载期直接 ValueError
  path: "/tmp/memes.db"

help_doc:                     # 表情包扩展帮助文档
  # ⚠️ 可以「关闭 + 不填路径」，但不能「启用 + 不填路径」——后者加载期直接 ValueError
  path: "/sdcard/Ncatbot_QQ/plugins/miaoli_bot/plugins/meme_ops/data/meme_helper.md"
  encoding: "utf-8"           # 读取 help_doc.path 用的编码
