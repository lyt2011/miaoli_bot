# permission 的三种取值:
#   "admin"      —— 仅 miaoli_bot 根配置里 account.admin_id 指定的管理员
#   "white_list" —— 该条目 white_list 名单里的 QQ 号
#   "anyone"     —— 任何调用者
#
# 白名单写法（示例，按需打开）:
#   - tool_name: "read_file"
#     permission: "white_list"
#     white_list: ["10001", "10002"]

enable: true

permissions:

  # —— base_system_tools ——
  - tool_name: "bash"
    permission: "admin"
  - tool_name: "read_file"
    permission: "admin"
  - tool_name: "write"
    permission: "admin"
  - tool_name: "replace"
    permission: "admin"
  - tool_name: "read_image"
    permission: "anyone"

  # —— base_platform_tools ——
  - tool_name: "send_message_to_qq"
    permission: "anyone"
  - tool_name: "send_file_to_qq"
    permission: "anyone"
  - tool_name: "download_qq_file"
    permission: "anyone"
  - tool_name: "delete_qq_message"
    permission: "anyone"
  - tool_name: "query_qq_message_id"
    permission: "anyone"

  # —— meme_extension ——
  - tool_name: "archive_meme"
    permission: "anyone"
  - tool_name: "send_meme_to_qq"
    permission: "anyone"
  - tool_name: "list_memes"
    permission: "anyone"
  - tool_name: "remove_meme_by_hash"
    permission: "adnin"
  - tool_name: "search_memes_by_tags"
    permission: "anyone"
