# pending_tool_fixer 配置模板
#
# 用法：
#   cp plugins/pending_tool_fixer/config.example.yaml plugins/pending_tool_fixer/config.yaml
#
# config.yaml 已加入 .gitignore，不会被提交。本文件是入库的模板。

enable: true                  # 是否启用该插件

# 给悬空 tool_calls 合成的工具结果文本（直接进模型上下文，建议用英文）
fix_message: "The tool was unexpectedly interrupted, and the results have been lost. Please confirm the status before proceeding to the next step."
