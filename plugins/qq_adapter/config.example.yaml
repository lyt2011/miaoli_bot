# qq_adapter 配置模板
#
# 用法：
#   cp plugins/qq_adapter/config.example.yaml plugins/qq_adapter/config.yaml
#
# config.yaml 已加入 .gitignore，不会被提交。本文件是入库的模板。
# 键名与 models/config/plugin_config.py 的 PluginConfig 一一对应。

enable: true                  # 是否启用该插件

split:                        # 输出切块与打字速度
  split_separator: "\n\n"     # 输出分隔符；不写 = 不切分；一旦填了就不能是空字符串
  base_typing_speed: 0.01     # 每个字的打字时间（秒）
  typing_speed_offset: 0.05   # 每字速度偏移（秒）
