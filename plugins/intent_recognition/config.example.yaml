# intent_recognition 配置模板
#
# 用法：
#   cp plugins/intent_recognition/config.example.yaml plugins/intent_recognition/config.yaml
#
# config.yaml 已加入 .gitignore，不会被提交。本文件是入库的模板。
#
# ⚠️ 三条硬约束（全部在加载期校验，违反直接起不来）：
#   1. file 是 FilePath —— 必须指向**真实存在的文件**，写错路径插件加载失败
#   2. 每条 rule 必须显式写 mode —— 它是判别字段，省略不会被默认值兜底
#   3. 全字段 extra="forbid" —— 键名拼错不会被静默忽略，直接 ValidationError

enable: false                   # 是否启用意图识别（模型默认 false，要用就得显式打开）

matchers: []                    # 匹配器列表，为空等于不做事


# ───────────────────────────────────────────────────────────────
# 下面是一个完整示例。要用就整段取消注释，并把 file 换成真实路径。
# 也可以只留其中一个 matcher —— 写了 matcher，rules 至少要有 1 条。
#
# 一个 matcher 的多条 rule 是「与」关系：**全部命中**才算命中，
# 命中后把 file 的内容以 name 为标签注入，多个 matcher 同时命中就都注入。
# ───────────────────────────────────────────────────────────────
#
# matchers:
#
#   - name: "meme"              # 标签名，注入后形如 <meme>...</meme>
#     file: "/sdcard/Ncatbot_QQ/plugins/miaoli_bot/plugins/intent_recognition/data/meme.md"
#     encoding: "utf-8"         # 读取 file 用的编码，默认 utf-8
#     rules:
#
#       # 单个关键词：命中就 True
#       - mode: "single_keyword"
#         word: "表情包"
#
#       # 多个关键词：至少命中 count 个才算 True
#       - mode: "min_keywords"
#         words: ["累", "困", "好烦"]
#         count: 2              # 默认 1，即任意一个命中就算
#
#       # 多个关键词：任意一个命中就 True
#       - mode: "any_keywords"
#         words: ["怎么装", "怎么安装", "装不上"]
#
#       # 正则：re.search 语义，命中子串即可
#       - mode: "regex"
#         regex: "1[3-9]\\d{9}"
#
#   - name: "privacy"
#     file: "/sdcard/Ncatbot_QQ/plugins/miaoli_bot/plugins/intent_recognition/data/privacy.md"
#     rules:
#       - mode: "single_keyword"
#         word: "身份证"
