# miaoli_bot 配置模板
#
# 用法：
#   1. cp config.example.yaml config.yaml
#   2. 把 api_key 换成真实密钥，account 换成真实账号
#
# 注意：config.yaml 已加入 .gitignore，不会被提交（内含密钥）。
#       本文件是入库的模板，不要在这里填真实密钥。
#
# 配置键名与 models/config/plugin.py 的 PluginConfig 字段一一对应。
# 插件加载时（on_load）会做一次校验：必填缺失 / 路径不存在 / 类型不符都会抛 ValidationError。

session_dir: "/tmp/"
prompt_file: "/sdcard/Ncatbot_QQ/plugins/miaoli_bot/data/prompts/prompt_v1.3.md"

providers:
  - name: "deepseek"
    base_url: "https://api.deepseek.com/v1"     # 请求地址，不会拼路径，填到 /v1 这一层
    api_key: "YOUR_API_KEY_HERE"
    models:
      - name: "deepseek-flash"
      - name: "deepseek-pro"

# 账号信息（四项全必填）：format_prompt 节点用它拼 <account> 提示词块
account:
  bot_id: "机器人QQ号"
  admin_id: "管理员QQ号"
  bot_nickname: "喵璃"
  admin_nickname: "主人"

# output：回复切块与打字延迟已落地消费（on_message），下面全是默认值，不用配也能跑。
# output:
#   typing_speed: 0.01           # 每个字的打字时间
#   typing_speed_offset: 0       # 打字速度偏移
#   split_separator: "\n\n"      # 输出切块分隔符；不写（默认 null）= 不切块，空串会被校验拒绝

sub_plugin:                    # 子插件加载（缺失 load_from 会报 TypeError）
  is_enable: false             # 当前未被消费（PluginLoader 无条件加载）
  load_from: "/sdcard/Ncatbot_QQ/plugins/miaoli_bot/plugins"   # 内置子插件所在目录（随本仓库提交）

# checkpointer：checkpoint 数据库（0.8.4 起已接线，on_load 按 database 选适配器）
#   memory     进程内内存，重启即丢（默认，不需要 connect_to）
#   sqlite     connect_to 填 db 文件路径
#   postgresql connect_to 填 DSN（postgresql://user:pass@host:port/db）
# checkpointer:
#   database: "memory"           # memory / sqlite / postgresql
#   connect_to: null             # database 非 memory 时必填
#   extra: {}                    # 额外参数，透传给适配器的 connect(**kwargs)
#                                #   memory：暂未使用
#                                #   sqlite：暂未使用
#                                #   postgresql：max_size（默认 8）/ min_size（默认 4）/ autocommit（默认 true）/ row_factory（默认 dict_row）
