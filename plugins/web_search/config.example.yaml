# web_search 配置模板
#
# 用法：
#   cp plugins/web_search/config.example.yaml plugins/web_search/config.yaml
#
# config.yaml 已加入 .gitignore，不会被提交。本文件是入库的模板。
# 键名与 models/plugin_config.py 的 PluginConfig 一一对应。

enable: true                  # 是否启用该插件

adapter: "langsearch"         # 搜索供应商（langsearch / deepseek）
api_url: "https://api.langsearch.com/v1/web-search"   # 搜索接口地址
api_key: "YOUR_SEARCH_API_KEY_HERE"                    # 搜索 api key
